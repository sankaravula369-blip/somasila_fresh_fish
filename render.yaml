services:
  - type: web
    name: sff-somasila-fresh-fish
    runtime: python
    plan: 0.5c-512mb
    region: oregon
    rootDir: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 60
    healthCheckPath: /healthz
    envVars:
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: sff-postgres
          property: connectionString
      - key: OWNER_WHATSAPP_NUMBER
        sync: false
      - key: OWNER_PASSWORD
        sync: false

databases:
  - name: sff-postgres
    databaseName: somasila_fresh_fish
    user: sff_app
    plan: 0.5c-1g
    diskSizeGB: 1
    region: oregon
    ipAllowList: []
